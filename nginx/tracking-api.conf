# nginx vhost cho Weather Tracking API (port 8002 nội bộ).
# Chỉ expose public endpoints — block /api/v1/admin/* hoàn toàn.
#
# Cài đặt VPS:
#   1. sudo cp tracking-api.conf /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/tracking-api.conf \
#                /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d tracking-206-72-200-120.nip.io
#   4. sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=30r/s;

proxy_cache_path /var/cache/nginx/tracking levels=1:2 keys_zone=tracking_cache:10m
  max_size=100m inactive=5m use_temp_path=off;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tracking-206-72-200-120.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS tracking-api ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tracking-206-72-200-120.nip.io;

    ssl_certificate     /etc/letsencrypt/live/tracking-206-72-200-120.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracking-206-72-200-120.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_tracking:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=tracking_zone burst=60 nodelay;
    limit_req_status 429;

    access_log /var/log/nginx/tracking-api.access.log;
    error_log  /var/log/nginx/tracking-api.error.log warn;

    # ── Block admin endpoints completely ─────────────────────────────────────
    location ~ ^/api/v1/admin {
        return 403;
    }

    # ── Public storm + map endpoints (cache 60s) ──────────────────────────────
    location ~ ^/api/v1/(storms|map|health) {
        proxy_pass http://127.0.0.1:6966;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache tracking_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # ── Root health check ─────────────────────────────────────────────────────
    location = / {
        proxy_pass http://127.0.0.1:6966;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location ~ /\.           { deny all; }
    location /               { return 404; }
}
